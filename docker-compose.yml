version: '3.5'

services:
  nginx-proxy:
    image: jwilder/nginx-proxy
    container_name: app_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # JSON dump of what docker-gen sees for every container
      # (/debug) — invaluable when a vhost mysteriously doesn't exist.
      DEBUG_ENDPOINT: "true"
    volumes:
      - ./ssl:/etc/nginx/certs
      - ./conf/locals.conf:/etc/nginx/conf.d/locals.conf
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - network

#Docker Networks
networks:
  network:
    name: proxy_network
    driver: bridge
